<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Game - Flags</title>
    <link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Asimovian&family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="game-title">
        <h1>MEMORY</h1>
        <h3>Europe Flags</h3>
      </div>
    </header>

    <div class="level-options">
      <h2>Chose a level</h2>
      <div class="button-wrapper">
        <button id="easy" class="button">Easy</button>
        <button id="medium" class="button">Medium</button>
        <button id="hard" class="button">Hard</button>
      </div>
    </div>

    <main id="game-board" class="game-board"></main>
    <script src="scripts.js"></script>
  </body>
</html>
